<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="Mindora — ask questions about your own PDFs, websites and videos, with answers grounded in your sources."
    />
    <meta name="color-scheme" content="light dark" />
    <title>Mindora — AI knowledge workspace</title>
    <script>
      // Apply the stored theme before first paint to avoid a flash.
      (function () {
        try {
          var stored = localStorage.getItem("mindora:theme");
          var dark =
            stored === "dark" ||
            ((stored === null || stored === "system") &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.classList.add("dark");
          document.documentElement.style.colorScheme = dark ? "dark" : "light";
        } catch (e) {
          /* localStorage unavailable — fall back to light */
        }
      })();
    </script>
  </head>
  <body class="h-full">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
